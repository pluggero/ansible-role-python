---
# Arch doesn't split runtime libs from their headers into separate packages
# (e.g. openssl, sqlite, zlib provide both), so removing them after the build
# would break Python's compiled ssl/sqlite3/bz2/lzma/curses/readline modules.
# Only the compiler toolchain is genuinely build-only here.
python_dep_pkgs:
  - tar
  - unzip
  - curl
  - openssl
  - libffi
  - sqlite
  - readline
  - bzip2
  - xz
  - gdbm
  - ncurses
  - zlib
  - python-pip
  - python-setuptools
  - python-wheel

python_build_pkgs:
  - base-devel
  - cmake

python_distro_pkgs:
  - python

---
- name: Ensure we are using apt
  ansible.builtin.fail:
    msg: "This role only supports {{ ansible_os_family }} systems that use apt as a package manager."
  when: ansible_pkg_mgr != "apt"

- name: Remove Python build dependencies via apt
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Ensure Python build pkgs are removed
      ansible.builtin.apt:
        name: "{{ package }}"
        state: absent
      loop: "{{ python_build_pkgs_to_remove }}"
      loop_control:
        loop_var: package
      become: true

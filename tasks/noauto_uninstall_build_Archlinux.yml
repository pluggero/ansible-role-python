---
- name: Ensure we are using pacman
  ansible.builtin.fail:
    msg: "This role only supports {{ ansible_os_family }} systems that use pacman as a package manager."
  when: ansible_pkg_mgr != "pacman"

- name: Remove Python build dependencies via pacman
  block:
    - name: Update pacman cache
      community.general.pacman:
        update_cache: true
      changed_when: false # The pacman module currently does not support cache_valid_time.
      become: true

    - name: Ensure Python build pkgs are removed
      community.general.pacman:
        name: "{{ package }}"
        state: absent
      loop: "{{ python_build_pkgs_to_remove }}"
      loop_control:
        loop_var: package
      become: true
